name: Validar interface da Biblioteca Rovuma
on:
  push:
    branches: [reconstrucao-modulos]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: playwright install --with-deps chromium
      - name: Verificar o portal e a administração em dois tamanhos de ecrã
        run: |
          export DEMO_STUDENT_PASSWORD="$(openssl rand -hex 24)"
          export DEMO_STAFF_PASSWORD="$(openssl rand -hex 24)"
          python manage.py migrate --noinput
          python manage.py demo_rovuma
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/rovuma-browser.log 2>&1 &
          curl --silent --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/entrar/ > /dev/null
          python ops/browser_smoke.py
