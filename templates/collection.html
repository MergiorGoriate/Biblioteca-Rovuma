{% extends "base.html" %}{% block content %}<div class="section-head"><h1>Gestão do acervo</h1><div class="actions"><a class="secondary" href="{% url 'locations' %}">Localizações</a><a class="primary" href="{% url 'new_work' %}">Nova obra</a></div></div>
<section class="panel"><form class="search"><label class="sr-only" for="q">Pesquisar por título</label><input id="q" name="q" placeholder="Pesquisar por título" value="{{ q }}"><button class="secondary">Pesquisar</button></form>
{% for work in page %}<div class="row"><div><a href="{% url 'manage_work' work.pk %}">{{ work.title }}</a><div class="small muted">{{ work.get_kind_display }}</div></div><span class="tag">{{ work.get_state_display }}</span></div>{% empty %}<p class="muted">Nenhuma obra encontrada.</p>{% endfor %}
{% include "pagination.html" %}</section>{% endblock %}
