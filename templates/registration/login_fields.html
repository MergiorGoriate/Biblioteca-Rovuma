{% if limited %}<p class="notice error" role="alert">Foram efectuadas demasiadas tentativas. Aguarde 15 minutos e volte a tentar.</p>{% endif %}
<form method="post">
  {% csrf_token %}{{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="primary">Entrar</button>
</form>
